<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Сменный испаритель">
  <defs>
    <linearGradient id="cMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a48"/>
      <stop offset=".35" stop-color="#1b1b25"/>
      <stop offset=".7" stop-color="#2a2a36"/>
      <stop offset="1" stop-color="#0c0c13"/>
    </linearGradient>
    <linearGradient id="cAcid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffb0"/>
      <stop offset="1" stop-color="#8ec400"/>
    </linearGradient>
    <radialGradient id="cHeat" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9ff3c" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#c9ff3c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c9ff3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="cGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#cHeat)" opacity=".5"/>

  <!-- outer ring -->
  <circle cx="160" cy="160" r="104" fill="none" stroke="url(#cMetal)" stroke-width="26"/>
  <circle cx="160" cy="160" r="104" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#c9ff3c" stroke-opacity=".28" stroke-width="1"/>

  <!-- thread ridges -->
  <g stroke="#ffffff" stroke-opacity=".14" stroke-width="3" stroke-linecap="round">
    <path d="M160 44v18M160 258v18M44 160h18M258 160h18"/>
    <path d="M244 76l-13 13M76 244l-13 13M244 244l-13-13M76 76l-13-13"/>
  </g>

  <!-- inner coil -->
  <circle cx="160" cy="160" r="62" fill="#08080e" stroke="#ffffff" stroke-opacity=".1"/>
  <g stroke="url(#cAcid)" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="160" cy="160" r="42" opacity=".95"/>
    <circle cx="160" cy="160" r="26" opacity=".55"/>
  </g>
  <circle cx="160" cy="160" r="42" fill="none" stroke="#c9ff3c" stroke-width="5" filter="url(#cGlow)" opacity=".8"/>

  <!-- cotton mesh -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="1.4">
    <path d="M112 132h96M112 148h96M112 164h96M112 180h96M112 196h96"/>
    <path d="M132 112v96M148 112v96M164 112v96M180 112v96M196 112v96"/>
  </g>

  <!-- center hotspot -->
  <circle cx="160" cy="160" r="8" fill="#e8ffb0"/>
  <circle cx="160" cy="160" r="8" fill="#c9ff3c" filter="url(#cGlow)"/>

  <circle cx="160" cy="160" r="140" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
</svg>
