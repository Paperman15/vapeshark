<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" role="img" aria-label="Жидкость для POD-систем">
  <defs>
    <linearGradient id="lGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242433"/>
      <stop offset=".4" stop-color="#12121b"/>
      <stop offset="1" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="lJuice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ff3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6ea300" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="lCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a38"/>
      <stop offset=".45" stop-color="#1a1a25"/>
      <stop offset="1" stop-color="#2a2a38"/>
    </linearGradient>
    <linearGradient id="lShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lGlowS" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="150" cy="260" rx="110" ry="180" fill="#c9ff3c" opacity=".12" filter="url(#lGlow)"/>
  <ellipse cx="150" cy="438" rx="76" ry="14" fill="#000" opacity=".5" filter="url(#lGlow)"/>

  <!-- dropper tip -->
  <path d="M138 34h24v26h-24z" fill="#1b1b26" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="130" y="58" width="40" height="10" rx="4" fill="#14141d"/>

  <!-- cap -->
  <rect x="112" y="68" width="76" height="58" rx="12" fill="url(#lCap)" stroke="#ffffff" stroke-opacity=".14"/>
  <g stroke="#c9ff3c" stroke-opacity=".45" stroke-width="2">
    <path d="M126 82v30M136 82v30M146 82v30M156 82v30M166 82v30M176 82v30"/>
  </g>

  <!-- neck -->
  <rect x="128" y="126" width="44" height="26" fill="#0d0d15"/>

  <!-- body -->
  <path d="M104 152h92c10 0 18 8 18 18v198c0 14-11 26-26 26h-76c-15 0-26-12-26-26V170c0-10 8-18 18-18z" fill="url(#lGlass)" stroke="#ffffff" stroke-opacity=".1"/>
  <!-- juice level -->
  <path d="M96 214h108v154c0 14-11 26-26 26h-56c-15 0-26-12-26-26z" fill="url(#lJuice)"/>
  <path d="M96 214h108" stroke="#e8ffb0" stroke-opacity=".6" stroke-width="2"/>

  <!-- label -->
  <g>
    <rect x="96" y="250" width="108" height="86" rx="10" fill="#06060b" opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="150" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e9e9f2" letter-spacing="2">VAPE SHARK</text>
    <text x="150" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9a9aae" letter-spacing="1.6">SALT NICOTINE</text>
    <g stroke-width="3" stroke-linecap="round">
      <path d="M126 320h48" stroke="#c9ff3c" opacity=".8"/>
    </g>
    <text x="150" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#c9ff3c" letter-spacing="2">30 ML · 20 MG</text>
  </g>

  <!-- shine -->
  <path d="M112 168h14c5 0 8 4 8 9v168c0 8-4 14-10 17-5 3-12 1-12-7z" fill="url(#lShine)"/>

  <!-- glow accents -->
  <circle cx="212" cy="196" r="3" fill="#c9ff3c" filter="url(#lGlowS)"/>
  <circle cx="76" cy="300" r="2" fill="#c9ff3c" opacity=".7"/>
</svg>
